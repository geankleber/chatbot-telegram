services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: n8n-postgres
        restart: unless-stopped
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - n8n
        # Descomente abaixo se precisar acessar o banco diretamente de fora da VPS
        # ports:
        #   - 5432:5432

    redis:
        image: redis:alpine
        container_name: n8n-redis
        restart: unless-stopped
        volumes:
            - redis_data:/data
        networks:
            - n8n
        # Descomente abaixo se precisar acessar o Redis diretamente de fora da VPS
        # ports:
        #   - 6379:6379

    n8n-editor:
        image: n8nio/n8n:latest
        container_name: n8n-editor
        restart: unless-stopped
        environment:
            - N8N_HOST=${N8N_HOST}
            - N8N_PORT=5678
            - N8N_PROTOCOL=https
            - WEBHOOK_URL=https://${N8N_HOST}/
            - GENERIC_TIMEZONE=America/Sao_Paulo
            - TZ=America/Sao_Paulo
            - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
            - N8N_RUNNERS_ENABLED=true
            - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
            - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
            ## Postgres
            - DB_TYPE=postgresdb
            - DB_POSTGRESDB_HOST=postgres
            - DB_POSTGRESDB_PORT=5432
            - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
            - DB_POSTGRESDB_USER=${POSTGRES_USER}
            - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
            ## Queue Mode
            - EXECUTIONS_MODE=queue
            - QUEUE_BULL_REDIS_HOST=redis
            - OFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
            ## Segurança
            - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
        volumes:
            - n8n_data:/home/node/.n8n
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - traefik-public
            - n8n
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.n8n.rule=Host(`${N8N_HOST}`)"
            - "traefik.http.routers.n8n.entrypoints=websecure"
            - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
            - "traefik.http.services.n8n.loadbalancer.server.port=5678"
            - "traefik.docker.network=traefik-public"

    n8n-worker:
        image: n8nio/n8n:latest
        container_name: n8n-worker
        command: worker
        restart: unless-stopped
        environment:
            - N8N_HOST=${N8N_HOST}
            - N8N_PORT=5678
            - N8N_PROTOCOL=https
            - WEBHOOK_URL=https://${N8N_HOST}/
            - GENERIC_TIMEZONE=America/Sao_Paulo
            - TZ=America/Sao_Paulo
            - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
            - N8N_RUNNERS_ENABLED=true
            - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
            - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
            ## Postgres
            - DB_TYPE=postgresdb
            - DB_POSTGRESDB_HOST=postgres
            - DB_POSTGRESDB_PORT=5432
            - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
            - DB_POSTGRESDB_USER=${POSTGRES_USER}
            - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
            ## Queue Mode
            - EXECUTIONS_MODE=queue
            - QUEUE_BULL_REDIS_HOST=redis
            - OFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
            ## Segurança
            - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
        volumes:
            - n8n_data:/home/node/.n8n
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - n8n

networks:
    traefik-public:
        external: true
    n8n:
        driver: bridge

volumes:
    postgres_data:
    n8n_data:
    redis_data:
